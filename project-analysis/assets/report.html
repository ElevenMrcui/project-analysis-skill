function safeLink(value){
 try{
  if(typeof value!=='string'||value!==value.trim()||/[\x00-\x20\x7f\\]/.test(value)||value.startsWith('/'))return null;
  const url=new URL(value,location.href);
  if(url.username||url.password)return null;
  if(/^https:\/\//i.test(value)&&url.protocol==='https:')return url.href;
  if(/^[a-z][a-z\d+.-]*:/i.test(value))return null;
  const decoded=decodeURIComponent(value.split(/[?#]/)[0]);
  if(/[\\%\x00-\x1f\x7f]/.test(decoded)||decoded.startsWith('/')||decoded.split('/').includes('..'))return null;
  const base=new URL('.',location.href);
  if(url.protocol===base.protocol&&url.origin===base.origin&&url.pathname.startsWith(base.pathname))return url.href;
 }catch(error){}
 return null;
}
function structured(value){
 if(value===null||value===undefined)return element('span','muted','null');
 if(Array.isArray(value)){if(!value.length)return element('span','muted','[]');const list=element('ul','structured-list');for(const item of value){const row=element('li');row.append(structured(item));list.append(row);}return list;}
 if(typeof value==='object'){const list=element('dl','properties');for(const [key,item] of Object.entries(value)){list.append(element('dt','',labels(key==='example'?'illustration':key)));const content=element('dd');content.append(structured(item));list.append(content);}return list;}
 if(typeof value==='string'&&entityById.has(value))return entityLink(value);
 if(typeof value==='string'&&evidenceById.has(value))return command(value,()=>openRecord(evidenceById.get(value)),'text-link detail-link');
 return element('span','',value);
}
function evidenceBlock(record){const block=element('div','evidence-block');block.append(element('strong','',record.id));const file=fileById.get(record.file);block.append(element('p','small',file?`${file.repo} / ${file.path}:${record.startLine}-${record.endLine}`:`${record.artifact||''} / ${record.locator||''}`));block.append(element('p','small muted',`${record.method||''} | ${record.snapshot||''}`));if(record.note)block.append(element('p','small',record.note));if(record.sourceUrl){const href=safeLink(record.sourceUrl);if(href){const link=element('a','small',labels('source'));link.href=href;link.target='_blank';link.rel='noopener noreferrer';block.append(link);}}return block;}
function relationLine(record){const row=element('div','relation-line');row.append(entityLink(record.from),element('span','small muted',record.label||record.kind),icon('arrow-right'),entityLink(record.to),pill(record.status));return row;}
function openRecord(record){
 const dialog=document.getElementById('detail');document.getElementById('detail-title').textContent=record.name||record.title||record.id||labels('record');document.getElementById('detail-kind').textContent=`${labels(record.kind||'record')} / ${record.id||''}`;const body=document.getElementById('detail-body');body.replaceChildren();
 if(record.status)body.append(pill(record.status));if(record.summary)body.append(element('p','description',record.summary));
 if(record.reportPath){const href=safeLink(record.reportPath);if(href){const link=element('a','detail-link',labels('diagram'));link.href=href;link.target='_blank';link.rel='noopener noreferrer';body.append(link);}}
 if(record.explanation)body.append(explain(record));
 if(record.details)body.append(structured(record.details));
 const related=report.relations.filter(edge=>edge.from===record.id||edge.to===record.id);if(related.length){const group=element('section','band');group.append(element('h3','',labels('related')));for(const edge of related)group.append(relationLine(edge));body.append(group);}
 if(record.steps)body.append(flow(record.steps));
 if(record.file||record.artifact)body.append(evidenceBlock(record));
 if(record.evidence?.length){const group=element('section','band');group.append(element('h3','',labels('evidence')));for(const identifier of record.evidence){const evidence=evidenceById.get(identifier);group.append(evidence?evidenceBlock(evidence):element('p','',identifier));}body.append(group);}
 const all=element('details','detail-group');all.append(element('summary','',labels('full')));const detail=element('div');detail.append(structured(record));all.append(detail);body.append(all);
 if(!dialog.open)dialog.showModal();body.scrollTop=0;icons();
}
function flow(steps){const list=element('ol','flow');steps.forEach((identifier,index)=>{const row=element('li');const entity=entityById.get(identifier);const button=command('',()=>openRecord(entity||{id:identifier,status:'unknown'}));button.append(element('span','node-kind',`${String(index+1).padStart(2,'0')} / ${labels(entity?.kind||'unknown')}`),element('span','node-name',entity?.name||identifier));row.append(button);if(index<steps.length-1){const arrow=icon('arrow-right');arrow.classList.add('arrow');arrow.setAttribute('aria-hidden','true');row.append(arrow);}list.append(row);});return list;}
function heading(title,description){const block=element('div','page-heading');const text=element('div');text.append(element('div','eyebrow',`项目全景 / ${labels(currentView)}`),element('h1','',title));if(description)text.append(element('p','description',description));block.append(text);return block;}
function band(title,action){const section=element('section','band');const header=element('div','band-head');header.append(element('h2','',title));if(action)header.append(action);section.append(header);return section;}
function navigate(view){currentView=view;filters={query:'',kind:'',repo:'',status:''};pageNumber=1;document.getElementById('sidebar').classList.remove('expanded');document.getElementById('menu').setAttribute('aria-expanded','false');history.pushState(null,'','#'+new URLSearchParams({view}).toString());render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}
function renderOverview(container){
 const header=heading(report.project.title,report.project.description);header.append(pill(report.validation.status));container.append(header);
 const roots=element('div','root-list');for(const root of report.roots){const item=element('span','root');item.append(element('strong','',root.id+' '),document.createTextNode((root.revision||'unavailable').slice(0,16)+(root.dirty?' + dirty':'')));roots.append(item);}container.append(roots);
 if(report.project.example)container.append(element('div','notice example-notice',labels('example')));if(report.validation.issues.length)container.append(element('div','notice',labels('warning')));
 const metrics=element('section','metrics');const values=[[report.entities.length,'records',`${report.entities.filter(record=>record.kind==='feature').length} ${labels('features')} / ${report.entities.filter(record=>record.kind==='table').length} ${labels('tables')}`],[report.chains.length,'chains',`${report.relations.length} ${labels('relations')}`],[report.validation.metrics.fileReviewPercent===null?labels('notMeasured'):(report.validation.metrics.fileReviewPercent??0)+'%','review',`${report.validation.metrics.reviewedFiles??0} / ${report.validation.metrics.eligibleFiles??0}`],[report.validation.issues.length,'issues',`${report.evidence.length} ${labels('evidenceCount')}`]];
 for(const [value,label,meta] of values){const item=element('div','metric');item.append(element('div','value',value),element('div','label',labels(label)),element('div','meta',meta));metrics.append(item);}container.append(metrics);
 const architecture=report.diagrams.find(record=>record.type==='architecture');if(architecture)container.append(diagramPanel(architecture,true));
 if(report.chains.length){const section=band(labels('flows'),command(labels('viewAll'),()=>navigate('chains'),'text-link'));const chain=report.chains[0];section.append(element('h3','',chain.name||chain.id),flow(chain.steps),element('p','small muted',chain.outcome||chain.summary||''));container.append(section);}
 const domains=band(labels('domains'));const grid=element('div','domain-grid');for(const record of report.sections){const item=element('article','domain');const top=element('header');top.append(command(record.title||labels(record.id),()=>openRecord(record),'text-link'),pill(record.status));item.append(top,element('p','',record.summary));grid.append(item);}domains.append(grid);container.append(domains);
 if(report.project.sources){const sources=band(labels('references'));sources.append(structured(report.project.sources));container.append(sources);}
}
function recordsForView(){if(currentView==='coverage')return report.validation.issues.map((record,index)=>({...record,id:`ISSUE-${index+1}`,name:record.code,summary:record.message,status:'open'}));return report[currentView]||[];}
function filteredRecords(){return recordsForView().filter(record=>{let text=searchCache.get(record);if(!text){text=JSON.stringify(record).toLocaleLowerCase();searchCache.set(record,text);}return (!filters.query||text.includes(filters.query.toLocaleLowerCase()))&&(!filters.kind||record.kind===filters.kind)&&(!filters.repo||record.repo===filters.repo)&&(!filters.status||record.status===filters.status);});}
function filterbar(records,container,results){const bar=element('form','filterbar');bar.addEventListener('submit',event=>event.preventDefault());const search=element('label','field search',labels('search'));const input=element('input');input.type='search';input.value=filters.query;input.placeholder=labels('search');input.setAttribute('aria-label',labels('search'));input.addEventListener('input',()=>{filters.query=input.value;pageNumber=1;renderResults(results);});search.append(input);bar.append(search);
 for(const key of ['kind','repo','status']){const values=[...new Set(records.map(record=>record[key]).filter(Boolean))].sort();if(!values.length)continue;const label=element('label','field',labels(key));const select=element('select');select.setAttribute('aria-label',labels(key));select.append(new Option(labels('all'),''));for(const value of values)select.append(new Option(labels(value),value));select.value=filters[key];select.addEventListener('change',()=>{filters[key]=select.value;pageNumber=1;renderResults(results);});label.append(select);bar.append(label);}
 bar.append(iconCommand('rotate-ccw',labels('reset'),()=>{filters={query:'',kind:'',repo:'',status:''};pageNumber=1;render();}));container.append(bar);}
function renderResults(container){container.replaceChildren();const records=filteredRecords();const totalPages=Math.max(1,Math.ceil(records.length/pageSize));pageNumber=Math.min(pageNumber,totalPages);const top=element('div','results-head');const count=element('p','small muted',`${records.length} ${labels('count')}`);count.setAttribute('role','status');count.setAttribute('aria-live','polite');top.append(count,iconCommand('file-down',labels('csv'),()=>exportCSV(records)));container.append(top);
 if(!records.length){container.append(element('div','empty',labels('empty')));icons();return;}
 const visible=records.slice((pageNumber-1)*pageSize,pageNumber*pageSize);
 if(currentView==='chains'){const list=element('div','chain-list');for(const record of visible){const article=element('article','chain');const header=element('header');header.append(command(record.name||record.id,()=>openRecord(record),'text-link'),pill(record.status));article.append(header,flow(record.steps||[]),element('p','small muted',record.outcome||record.summary||''));list.append(article);}container.append(list);}
 else{const scroll=element('div','table-scroll');scroll.tabIndex=0;scroll.setAttribute('role','region');scroll.setAttribute('aria-label',labels(currentView));const table=element('table','catalog');const head=element('thead');const row=element('tr');for(const label of ['type','name','summary','status']){const cell=element('th','',labels(label));cell.scope='col';row.append(cell);}head.append(row);table.append(head);const body=element('tbody');for(const record of visible){const row=element('tr');row.append(element('td','small muted',labels(record.kind||record.code||currentView)));const name=element('td');name.append(command(record.name||record.title||record.path||record.id,()=>openRecord(record),'text-link record-name'),element('div','record-id',record.id));const summary=record.summary||record.reason||record.note||record.message||record.label||record.method||'';row.append(name,element('td','small',summary));const state=element('td');state.append(pill(record.status||'unknown'));row.append(state);body.append(row);}table.append(body);scroll.append(table);container.append(scroll);}
 const pager=element('div','pager');const previous=iconCommand('chevron-left',labels('previous'),()=>{pageNumber--;renderResults(container);});previous.disabled=pageNumber===1;const next=iconCommand('chevron-right',labels('next'),()=>{pageNumber++;renderResults(container);});next.disabled=pageNumber===totalPages;pager.append(previous,element('span','',`${pageNumber} / ${totalPages}`),next);container.append(pager);icons();}
function exportCSV(records){const keys=[...new Set(records.flatMap(record=>Object.keys(record)))];const quote=value=>{let text=typeof value==='object'?JSON.stringify(value):String(value??'');if(/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const body=[keys.map(quote).join(','),...records.map(record=>keys.map(key=>quote(record[key])).join(','))].join('\r\n');download('project-analysis-'+currentView+'.csv','\uFEFF'+body,'text/csv;charset=utf-8');}
function renderCoverage(container){container.append(heading(labels('coverage'),labels('noProof')));container.append(pill(report.validation.status));const metrics=band(labels('metrics'));metrics.append(structured(report.validation.metrics));container.append(metrics);const results=element('div');filterbar(recordsForView(),container,results);container.append(results);renderResults(results);
 for(const [key,records] of [['gaps',report.gaps],['checks',report.checks],['discovery',report.discoveries],['limitations',report.validation.limitations]]){const section=band(`${labels(key)} (${records.length})`);const detail=element('details','detail-group');detail.append(element('summary','',labels('show')));detail.addEventListener('toggle',()=>{if(detail.open&&!detail.dataset.loaded){detail.dataset.loaded='true';detail.append(structured(records));}});section.append(detail);container.append(section);}}
function render(){document.documentElement.lang=locale;document.getElementById('locale').value=locale;document.title=report.project.title+' | 项目分析';document.querySelector('[data-label=workspace]').textContent=labels('workspace');document.getElementById('crumb').textContent='项目分析 / '+labels(currentView);document.getElementById('snapshot').textContent=report.project.generatedAt||'';for(const key of ['theme','export','print','close']){const node=document.getElementById(key);node.title=labels(key);node.setAttribute('aria-label',labels(key));}
 const nav=document.getElementById('nav');nav.replaceChildren();for(const [view,name] of navigation){const button=command('',()=>navigate(view));button.append(icon(name),element('span','',labels(view)));if(report[view])button.append(element('span','nav-count',report[view].length));if(view==='coverage')button.append(element('span','nav-count',report.validation.issues.length));if(currentView===view)button.setAttribute('aria-current','page');nav.append(button);}
 const container=document.getElementById('interactive');container.replaceChildren();container.className='view';if(currentView==='overview')renderOverview(container);else if(currentView==='coverage')renderCoverage(container);else if(currentView==='diagrams')renderDiagrams(container);else if(currentView==='database')renderDatabase(container);else{container.append(heading(labels(currentView),report.project.title));const results=element('div');filterbar(recordsForView(),container,results);container.append(results);renderResults(results);}container.append(element('p','footnote',labels('noProof')));icons();}
function makePrint(){const target=document.getElementById('print-all');target.replaceChildren(element('h1','',report.project.title),element('p','',labels('noProof')));if(report.project.example)target.append(element('p','',labels('example')));addDiagramPrint(target);for(const key of ['project','roots','sections','entities','relations','chains','files','evidence','discoveries','checks','gaps','validation']){const section=element('section');section.append(element('h2','',labels(key)));const records=Array.isArray(report[key])?report[key]:[report[key]];for(const record of records){const article=element('article');article.append(structured(record));section.append(article);}target.append(section);}}
document.getElementById('locale').addEventListener('change',event=>{locale=event.target.value;render();});
document.getElementById('theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('project-analysis-theme',theme);}catch(error){}if(['overview','diagrams','database'].includes(currentView))render();});
document.getElementById('export').addEventListener('click',()=>download('project-analysis.json',JSON.stringify(report,null,2),'application/json'));
document.getElementById('print').addEventListener('click',async()=>{const button=document.getElementById('print');button.disabled=true;try{await prepareDiagramPrint();makePrint();window.print();}catch(error){notify('打印准备失败：'+error.message);}finally{button.disabled=false;}});
window.addEventListener('beforeprint',makePrint);window.addEventListener('afterprint',()=>document.getElementById('print-all').replaceChildren());
document.getElementById('close').addEventListener('click',()=>document.getElementById('detail').close());
document.getElementById('detail').addEventListener('keydown',event=>{if(event.key==='Escape'&&!event.defaultPrevented){event.preventDefault();event.currentTarget.close();}});
document.getElementById('menu').addEventListener('click',()=>{const expanded=document.getElementById('sidebar').classList.toggle('expanded');document.getElementById('menu').setAttribute('aria-expanded',String(expanded));});
function restoreHash(){const params=new URLSearchParams(location.hash.slice(1));const view=params.get('view');if(navigation.some(item=>item[0]===view))currentView=view;render();const entity=entityById.get(params.get('entity'));if(entity)openRecord(entity);}
window.addEventListener('hashchange',restoreHash);
__DIAGRAM_VIEWER__
try{document.documentElement.dataset.theme=localStorage.getItem('project-analysis-theme')||'light';}catch(error){}
restoreHash();
</script>
</body>
